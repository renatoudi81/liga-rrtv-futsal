<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle Disciplinar — 1ª Liga RRTV de Futsal</title>
<style>
:root{
  --ink:#14161a; --ink2:#545c68; --ink3:#8b95a3;
  --paper:#fff; --panel:#f2f4f7; --panel2:#e8ebf0;
  --rule:#dbe0e7; --rule2:#c3cad4;
  --am:#eab308; --am-bg:#fef5d8; --am-ink:#6b4d00;
  --vm:#cc2233; --vm-bg:#fce8ea; --vm-ink:#8a1020;
  --ok:#0d7a44; --ok-bg:#e3f4ea;

  /* Paleta real do escudo do Rubinho Sports: vermelho, preto e branco */
  --rb-blk:#0d0d0f; --rb-red:#b01010; --rb-red2:#8c0d0d; --rb-wht:#f2f2f2;
  --rb-ring:linear-gradient(90deg,var(--rb-red2),var(--rb-red) 30%,var(--rb-red) 70%,var(--rb-red2));

  /* Acento da interface: o vermelho institucional do escudo, mais escuro e
     fechado que o vermelho vivo de cartão (--vm #cc2233), que segue
     exclusivo para punição junto do amarelo. */
  --az:#8c0d0d; --az-bg:#f7e9e9;
  --shadow:0 1px 2px rgba(20,22,26,.07),0 2px 8px rgba(20,22,26,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--panel); color:var(--ink);
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--az);outline-offset:2px}

/* ── SHELL ─────────────────────────────── */
#shell{display:flex;flex-direction:column;height:100%;max-width:1180px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px var(--rule)}

/* ── CABEÇALHO (estilo súmula) ─────────── */
#top{background:var(--rb-blk);color:#fff;padding:15px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
#ring{height:4px;background:var(--rb-ring);flex-shrink:0}
.ttl{display:flex;align-items:center;gap:13px}
.ttl-logo{width:46px;height:46px;flex-shrink:0;display:block;
  filter:drop-shadow(0 2px 7px rgba(176,16,16,.5))}
.ttl h1{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.05;color:#fff}
.ttl p{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;margin-top:3px;color:#c9636a}
.kpis{display:flex;gap:2px;align-items:stretch}
.kpi{padding:4px 13px;border-left:1px solid rgba(255,255,255,.13);text-align:center;min-width:64px}
.kpi:first-child{border-left:none}
.kpi b{display:block;font-size:21px;font-weight:800;line-height:1;letter-spacing:-.5px;color:#fff}
.kpi span{display:block;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#7c8794;margin-top:4px}
.kpi.a b{color:var(--am)} .kpi.v b{color:#ef5350} .kpi.s b{color:#ef5350}
.kpi.ref b{color:#8fa0b3}
.kpi.ref em{display:block;font-style:normal;font-size:8.5px;font-weight:700;color:#c9636a;margin-top:2px;cursor:help}

/* ── ABAS ──────────────────────────────── */
#nav{display:flex;border-bottom:1px solid var(--rule);background:var(--panel);overflow-x:auto;flex-shrink:0}
.nav-b{padding:11px 17px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);border-bottom:3px solid transparent;white-space:nowrap;transition:.12s}
.nav-b:hover{color:var(--ink)}
.nav-b.on{color:var(--ink);background:var(--paper);border-bottom-color:transparent;
  box-shadow:inset 0 -3px 0 0 transparent;position:relative}
.nav-b.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--rb-ring)}
.nav-b .cnt{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--rb-red);color:#fff;font-size:10px;font-weight:800}

/* ── PAINÉIS ───────────────────────────── */
.pane{display:none;flex:1;overflow-y:auto;min-height:0}
.pane.on{display:block}
.pane-in{padding:18px 20px 40px}

/* ── SELETOR DE RODADA ─────────────────── */
#rbar{border-bottom:1px solid var(--rule);background:var(--panel);padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex-shrink:0}
.rnav{display:flex;align-items:center;gap:0;border:1px solid var(--rule2);border-radius:8px;background:var(--paper);overflow:hidden;box-shadow:var(--shadow)}
.rnav button{width:40px;height:46px;font-size:19px;color:var(--ink2);transition:.12s}
.rnav button:hover:not(:disabled){background:var(--panel2);color:var(--ink)}
.rnav button:disabled{color:#ccd2da;cursor:not-allowed}
.rnav .rnum{padding:0 4px;text-align:center;min-width:98px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.rnav .rnum b{display:block;font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.rnav .rnum span{display:block;font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}
.rflag{display:flex;flex-direction:column;gap:3px}
.rflag-t{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.rflag-v{font-size:13px;font-weight:700}
.rdone{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.rdone input{width:18px;height:18px;accent-color:var(--az);cursor:pointer}

/* ── CHIPS DE EQUIPE ───────────────────── */
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:7px 13px;border:1px solid var(--rule2);border-radius:20px;background:var(--paper);font-size:12px;font-weight:700;color:var(--ink2);transition:.12s;display:flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--rb-blk);border-color:var(--rb-blk);color:#fff}
.chip .cb{display:inline-flex;gap:3px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.a{background:var(--am)} .dot.v{background:var(--vm)}

/* ── LANÇAMENTO: LISTA ─────────────────── */
.sq-hd{display:flex;align-items:baseline;gap:10px;padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:0}
.sq-hd h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sq-hd span{font-size:11px;font-weight:600;color:var(--ink3)}
.sq-hd .sq-legend{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.sq-hd .addq{margin-left:auto;padding:5px 11px;font-size:11.5px}

.sqg{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(140px,1.05fr) 103px 116px;gap:18px;align-items:center}
.plr-hd{padding:9px 10px 7px;border-bottom:1px solid var(--rule2)}
.plr-hd span{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.plr-hd .c{text-align:center}
.plr{padding:8px 10px;border-bottom:1px solid var(--rule);border-left:3px solid transparent;transition:.11s}
.plr:hover{background:#fafbfd;border-left-color:var(--rule2)}
.plr.sit{background:var(--vm-bg);border-left-color:var(--vm)}
.plr.hot{border-left-color:var(--am)}
.plr.sus{border-left-color:var(--vm)}
.plr-id{min-width:0}
.plr-n{font-size:14.5px;font-weight:600;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plr-m{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.plr-m b{font-weight:700;color:var(--ink2)}
.warn{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.1px}
.warn.sus{background:var(--vm);color:#fff}
.warn.dbl{background:linear-gradient(101deg,var(--vm) 50%,var(--rb-blk) 50%);color:#fff}
.btn.mini{padding:2px 8px;font-size:10.5px;margin-left:6px}
.fora{justify-self:center;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--vm-ink);opacity:.75;user-select:none}
.warn.risk{background:var(--am-bg);color:var(--am-ink)}
.warn.sit{background:var(--vm-ink);color:#fff}
.warn.free{background:var(--ok-bg);color:var(--ok)}

/* toggles de cartão: alvos grandes */
.cards{display:flex;gap:5px;justify-content:center}
.cbtn{width:49px;height:42px;border:1.5px solid var(--rule2);border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:.11s}
.cbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.cbtn i{width:21px;height:28px;border-radius:2px 2px 3px 3px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;font-style:normal;letter-spacing:0;transition:.11s;background:#eef0f4;color:#a8b0bb}
.cbtn.a{border-color:#e6dcb4} .cbtn.a:hover{border-color:var(--am)}
.cbtn.v{border-color:#e8c6cb} .cbtn.v:hover{border-color:var(--vm)}
.cbtn.a.on{background:var(--am-bg);border-color:var(--am)}
.cbtn.a.on i{background:var(--am);color:var(--am-ink);box-shadow:0 1px 3px rgba(234,179,8,.45)}
.cbtn.v.on{background:var(--vm-bg);border-color:var(--vm)}
.cbtn.v.on i{background:var(--vm);color:#fff;box-shadow:0 1px 3px rgba(204,34,51,.4)}
.cbtn.dbl{gap:2px;background:var(--am-bg);border-color:var(--am)}
.cbtn.dbl i{width:15px;height:26px;font-size:10px;background:var(--am);color:var(--am-ink);box-shadow:0 1px 2px rgba(234,179,8,.45)}
.cbtn.v.auto{cursor:not-allowed;opacity:.85}
.cbtn.v.auto i{background:var(--vm);color:#fff;box-shadow:none}
.cbtn.v.auto:hover{transform:none;box-shadow:none}
.cbtn:disabled{pointer-events:auto}

/* stepper de gols */
.gol{display:flex;align-items:center;justify-self:center;border:1px solid var(--rule2);border-radius:7px;overflow:hidden;background:var(--paper)}
.gol button{width:34px;height:44px;font-size:17px;font-weight:700;color:var(--ink2);transition:.11s}
.gol button:hover:not(:disabled){background:var(--panel2);color:var(--ink)}
.gol button:disabled{color:#d3d8df;cursor:not-allowed}
.gol .gv{width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.gol .gv.z{color:#c3cad4;font-weight:600}

/* ── SUSPENSOS ─────────────────────────── */
.sec{margin-bottom:30px}
.sec-hd{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:14px;flex-wrap:wrap}
.sec-hd h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sec-hd .n{padding:2px 9px;border-radius:11px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800}
.sec-hd .acts{margin-left:auto;display:flex;gap:7px}
.btn{padding:7px 13px;border:1px solid var(--rule2);border-radius:6px;background:var(--paper);font-size:12px;font-weight:700;color:var(--ink2);transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink);color:var(--ink);background:var(--panel)}
.btn.pri{background:var(--rb-red);border-color:var(--rb-red);color:#fff}
.btn.pri:hover{background:var(--rb-red2);border-color:var(--rb-red2);color:#fff}
.btn.dgr{color:var(--vm);border-color:#e8b4bb}
.btn.dgr:hover{background:var(--vm-bg);border-color:var(--vm);color:var(--vm-ink)}

.sus-team{margin-bottom:15px;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.sus-team-h{padding:8px 13px;background:var(--panel);border-bottom:1px solid var(--rule);font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  box-shadow:inset 3px 0 0 0 var(--rb-red)}
.sus-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--rule)}
.sus-row:last-child{border-bottom:none}
.sus-card{width:20px;height:27px;border-radius:2px 2px 3px 3px;flex-shrink:0}
.sus-card.a{background:var(--am)} .sus-card.v{background:var(--vm)}
.sus-card.av{background:linear-gradient(101deg,var(--am) 48%,var(--vm) 48%)}
.sus-card.d2{background:var(--am);box-shadow:inset 0 0 0 2.5px var(--vm)}
.sus-i{flex:1;min-width:0}
.sus-i b{display:block;font-size:14px;font-weight:600}
.sus-i span{font-size:11.5px;color:var(--ink3)}
.sus-r{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--vm);white-space:nowrap;text-align:right;line-height:1.5}
.sus-r b.dois{display:inline-block;background:var(--vm);color:#fff;padding:2px 8px;border-radius:11px;font-size:10.5px}

.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th{text-align:left;padding:7px 9px;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule2);background:var(--panel)}
.hist td{padding:8px 9px;border-bottom:1px solid var(--rule)}
.hist tr:hover td{background:#fafbfd}
.hist .c{text-align:center}
.hist .mut{color:var(--ink3);font-size:12px}

/* ── GRADE ─────────────────────────────── */
.gwrap{overflow:auto;border:1px solid var(--rule);border-radius:9px;background:var(--paper)}
.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th{background:var(--panel);padding:8px 7px;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule2);position:sticky;top:0;z-index:3;white-space:nowrap;text-align:center}
.grid th.l{text-align:left}
.grid th.pin{left:0;z-index:5;text-align:left;border-right:1px solid var(--rule2)}
.grid td{padding:0;border-bottom:1px solid var(--rule);text-align:center;height:34px}
.grid td.pin{position:sticky;left:0;background:var(--paper);z-index:2;text-align:left;padding:0 10px;border-right:1px solid var(--rule2);white-space:nowrap;font-weight:600;min-width:190px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.grid tr:hover td{background:#fafbfd}
.grid tr:hover td.pin{background:#f5f7fa}
.grid tr.gteam td{background:var(--rb-blk)!important;color:#fff;text-align:left;padding:5px 10px 5px 12px;font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;height:auto;position:sticky;left:0;
  box-shadow:inset 3px 0 0 0 var(--rb-red)}
.gc{display:inline-flex;align-items:center;justify-content:center;width:19px;height:25px;border-radius:2px 2px 3px 3px;font-size:8px;font-weight:800;color:#fff}
.gc.a{background:var(--am);color:var(--am-ink)}
.gc.v{background:var(--vm)}
.gc.av{background:linear-gradient(101deg,var(--am) 48%,var(--vm) 48%)}
.gc.d2{background:var(--am);color:var(--am-ink);box-shadow:inset 0 0 0 2px var(--vm)}
.gempty{color:#e3e7ec;font-size:15px}
.grid td.fut{background:repeating-linear-gradient(45deg,transparent,transparent 4px,#f7f8fa 4px,#f7f8fa 8px)}
.gtot{font-weight:800;font-size:13px}
.gtot.a{color:var(--am-ink)} .gtot.v{color:var(--vm)}
sup.futn{font-size:8.5px;font-weight:800;color:var(--ink3);margin-left:2px;cursor:help}
.gcic{font-weight:800}
.gcic.w1{color:var(--ink2)} .gcic.w2{color:#b45309} .gcic.w3{color:var(--vm)}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--vm);color:#fff}
.pill.zr{background:var(--vm-bg);color:var(--vm-ink)}
.pill.mt{background:var(--panel2);color:var(--ink2)}
.pill.j2{background:var(--rb-red);color:#fff;margin-left:4px}

/* regulamento */
.reg{border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.reg-r{padding:11px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.reg-r b{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.tag{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:4px}
.tag.am{background:var(--am);color:var(--am-ink)}
.tag.vm{background:var(--vm);color:#fff}
.tag.av{background:linear-gradient(101deg,var(--am) 48%,var(--vm) 48%);color:#fff}
.tag.sm{background:var(--rb-red);color:#fff}
.reg-r.sum{background:#fdf4fb;box-shadow:inset 3px 0 0 0 var(--rb-red)}
.reg-r span{font-size:12px;color:var(--ink2);line-height:1.4}
.reg-r span b.z{color:var(--vm);font-weight:700}
.reg-r span b.m{color:var(--ok);font-weight:700}
.reg-opt{display:flex;gap:11px;padding:13px 14px;background:var(--panel);cursor:pointer;align-items:flex-start}
.reg-opt input{width:18px;height:18px;accent-color:var(--az);cursor:pointer;flex-shrink:0;margin-top:1px}
.reg-opt span{display:flex;flex-direction:column;gap:3px;min-width:0}
.reg-opt b{font-size:13px;font-weight:700}
.reg-opt em{font-style:normal;font-size:11.5px;color:var(--ink3);line-height:1.45}

.glegend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;color:var(--ink2)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.glegend i{font-style:normal;flex-shrink:0}

/* ── FILTROS ───────────────────────────── */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select,.filters input{padding:8px 11px;border:1px solid var(--rule2);border-radius:7px;background:var(--paper);font-size:13px;outline:none;transition:.12s}
.filters select:focus,.filters input:focus{border-color:var(--az);box-shadow:0 0 0 3px var(--az-bg)}
.filters input{flex:1;min-width:170px}

/* ── ARTILHARIA / EQUIPES ──────────────── */
.rank{width:100%;border-collapse:collapse;font-size:13.5px}
.rank th{text-align:left;padding:8px 10px;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule2);background:var(--panel);white-space:nowrap}
.rank th.c,.rank td.c{text-align:center}
.rank th.s{cursor:pointer;user-select:none}
.rank th.s:hover{color:var(--ink)}
.rank td{padding:9px 10px;border-bottom:1px solid var(--rule)}
.rank tr:hover td{background:#fafbfd}
.rank .pos{font-weight:800;font-size:14px;width:44px;color:var(--ink3)}
.rank tr.top1 .pos{color:var(--rb-red)} .rank tr.top2 .pos{color:#3a3f46} .rank tr.top3 .pos{color:#8c6d1f}
.rank .nm{font-weight:600}
.rank .tm{font-size:11.5px;color:var(--ink3)}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--rb-red2),var(--rb-red));}
.big{font-size:15px;font-weight:800}

.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;font-size:14px;color:var(--ink2);margin-bottom:5px}
.empty span{font-size:12.5px}

/* gestão de elenco */
.addbox{display:flex;gap:8px;padding:13px;border:1px dashed var(--rule2);border-radius:9px;background:var(--panel);margin-bottom:18px;flex-wrap:wrap;align-items:center}
.addbox select,.addbox input{padding:8px 11px;border:1px solid var(--rule2);border-radius:7px;background:var(--paper);font-size:13px;outline:none}
.addbox input{flex:1;min-width:160px}
.addbox select:focus,.addbox input:focus{border-color:var(--az)}
.xbtn{width:28px;height:28px;border-radius:6px;color:var(--ink3);font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.xbtn:hover{background:var(--vm-bg);color:var(--vm)}

/* ── RODAPÉ / TOAST ────────────────────── */
#foot{border-top:3px solid transparent;border-image:var(--rb-ring) 1;padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);flex-shrink:0}
#foot .crit{font-size:11px;color:var(--ink3);font-weight:600}
#foot .fa{margin-left:auto;display:flex;gap:7px}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,70px);background:var(--rb-blk);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── RESPONSIVO ────────────────────────── */
@media(max-width:720px){
  #top{padding:12px 14px}
  .ttl-logo{width:38px;height:38px}
  .ttl h1{font-size:17px}
  .kpis{width:100%;justify-content:space-between}
  .kpi{padding:4px 8px;min-width:0;flex:1}
  #rbar,.pane-in,#foot{padding-left:14px;padding-right:14px}
  .rdone{margin-left:0;width:100%}
  .sqg{grid-template-columns:1fr auto auto;gap:10px}
  .plr-hd{display:none}
  .plr-m{grid-column:1/-1;margin-top:3px}
  .gol{justify-self:end}
  .sec-hd .acts{margin-left:0;width:100%}
}
@media print{
  body{background:#fff}
  #top{background:#fff!important;color:var(--ink)!important;border-bottom:2px solid var(--ink)}
  #top h1{color:var(--ink)!important}
  #top .ttl p{color:var(--ink3)!important;background:none;-webkit-text-fill-color:var(--ink3)}
  #top .kpi b{color:var(--ink)!important}
  #top .kpi span{color:var(--ink3)!important}
  #ring{display:none}
  #nav,#rbar,#foot,#chips,.sec-hd .acts,.filters{display:none!important}
  #shell{box-shadow:none;max-width:none}
  .pane{display:none!important;overflow:visible}
  .pane.on{display:block!important}
  .sus-team{break-inside:avoid}
}

];/* ══════════════════════════════════════════════════════════
   REGRAS (espelham a planilha 1ª Liga RRTV)
   1. 3 amarelos no ciclo  → suspensão na partida seguinte
   2. 1 vermelho (ou A+V)  → suspensão na partida seguinte
   3. O ciclo de amarelos zera SOMENTE quando a suspensão é
      cumprida, não no momento em que é aplicada.
   4. Ciclo e situação consideram apenas rodadas concluídas.
   ══════════════════════════════════════════════════════════ */
const ROUNDS = 11, YL = 3;
const K_ROS = 'rrtv_roster_v2', K_CFG = 'rrtv_cfg_v2';

/* Estados possíveis de uma rodada:
   ''   sem cartão
   'A'  um amarelo
   '2A' dois amarelos no mesmo jogo → expulsão automática
   'V'  vermelho direto
   'AV' um amarelo + vermelho direto (infrações distintas)      */

let roster = [], lastRound = 4, curRound = 4, curTeam = null;
let gEq = '', gSt = '', gQ = '', eqSort = 'am';

/* Regulamento configurável: os dois amarelos que geram a expulsão
   entram no ciclo de acumulação? Padrão CBFS: não entram, pois já
   foram consumidos pela expulsão. */
let duploConta = false;

/* Decompõe o estado da rodada */
function parse(c) {
  return {
    am:   c === '2A' ? 2 : (c === 'A' || c === 'AV') ? 1 : 0,
    vm:   (c === 'V' || c === 'AV') ? 1 : 0,
    dup:  c === '2A',
    exp:  c === '2A' || c === 'V' || c === 'AV'
  };
}

/* Amarelos que contam para o ciclo de acumulação */
function amCiclo(c) {
  const i = parse(c);
  if (i.dup) return duploConta ? 2 : 0;
  return i.am;
}

/* ── MOTOR DE CÁLCULO ─────────────────────────────────── */
function timeline(p) {
  const tl = {};
  let yc = 0;            /* amarelos no ciclo */
  let pend = 0;          /* jogos de suspensão ainda a cumprir */
  let zeraFim = false;   /* zera o ciclo ao terminar de cumprir */
  let fechado = false;   /* ciclo já gerou a suspensão, não pode gerar de novo
                            enquanto os 3 amarelos não forem zerados */

  for (let r = 1; r <= ROUNDS; r++) {
    /* 1. Cumprimento: cada rodada abate um jogo da pendência */
    const serving = pend > 0;
    const restavam = pend;
    if (serving) {
      pend--;
      if (pend === 0 && zeraFim) { yc = 0; zeraFim = false; fechado = false; }
    }

    /* 2. Cartões da rodada */
    const c = p.r[r] || '';
    const i = parse(c);
    const antes = yc;
    yc += amCiclo(c);

    /* 3. Motivos gerados. Cada motivo vale 1 jogo e eles SOMAM:
          3º amarelo + expulsão no mesmo jogo = 2 jogos. */
    const motivos = [];
    let zera = false;
    if (!fechado && yc >= YL) { motivos.push('A3'); zera = true; fechado = true; }
    if (i.exp)                { motivos.push(i.dup ? '2A' : 'V'); }

    if (motivos.length) {
      pend += motivos.length;
      if (zera) zeraFim = true;
    }

    tl[r] = {
      antes, depois: yc, card: c,
      serving, restavam,
      motivos, zera,
      jogos: motivos.length,
      pendDepois: pend,
      trigger: motivos.length ? motivos[motivos.length - 1] : null
    };
  }
  return tl;
}

function stats(p) {
  const tl = timeline(p);
  /* Oficiais: só rodadas concluídas. Lançamentos de rodadas em aberto
     ficam gravados mas não entram em nenhuma soma até a rodada fechar. */
  let ta = 0, tv = 0, tg = 0, taFut = 0, tvFut = 0, tgFut = 0;
  for (let r = 1; r <= ROUNDS; r++) {
    const i = parse(p.r[r] || '');
    if (r <= lastRound) {
      ta += i.am; if (i.exp) tv++; tg += (p.g[r] || 0);
    } else {
      taFut += i.am; if (i.exp) tvFut++; tgFut += (p.g[r] || 0);
    }
  }
  const trig = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const t = tl[r];
    if (!t.motivos.length) continue;
    trig.push({
      r, motivos: t.motivos, jogos: t.jogos, zera: t.zera,
      de: r + 1, ate: r + t.pendDepois
    });
  }

  return {
    tl, ta, tv, tg,
    ciclo: tl[lastRound] ? tl[lastRound].depois : 0,
    susp:  !!(tl[lastRound] && tl[lastRound].pendDepois > 0),
    jogosPend: tl[lastRound] ? tl[lastRound].pendDepois : 0,
    taFut, tvFut, tgFut,
    trig
  };
}

function motivo(t) {
  return t === 'A3' ? '3º amarelo (ciclo)'
       : t === '2A' ? '2 amarelos no mesmo jogo'
       : t === 'V'  ? 'Vermelho direto'
       : '';
}
function motivosTexto(ms) { return ms.map(motivo).join(' + '); }

function cardCls(ms) {
  const a = ms.includes('A3'), v = ms.includes('V'), d = ms.includes('2A');
  if (d) return 'd2';
  if (a && v) return 'av';
  if (v) return 'v';
  return 'a';
}

/* "5ª rodada" | "5ª e 6ª rodadas" | "5ª a 7ª rodadas" */
function rodadasTexto(de, ate) {
  if (ate <= de) return de + 'ª rodada';
  if (ate === de + 1) return de + 'ª e ' + ate + 'ª rodadas';
  return de + 'ª a ' + ate + 'ª rodadas';
}
function jogosTexto(n) { return n + (n === 1 ? ' jogo' : ' jogos'); }

function all() { return roster.map((p, i) => ({ p, i, s: stats(p) })); }

/* ── CABEÇALHO ────────────────────────────────────────── */
function rKpis() {
  const d = all();
  const ta = d.reduce((a, x) => a + x.s.ta, 0);
  const tv = d.reduce((a, x) => a + x.s.tv, 0);
  const tg = d.reduce((a, x) => a + x.s.tg, 0);
  const ns = d.filter(x => x.s.susp).length;
  const fut = d.reduce((a, x) => a + x.s.taFut + x.s.tvFut + x.s.tgFut, 0);
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><b>${d.length}</b><span>Jogadores</span></div>

}

    const c = p.r[curRound] || '';

    const t = s.tl[curRound];
    const gols = p.g[curRound] || 0;
    const conflito = t.serving && (c !== '' || gols > 0);
    const fora = t.serving && !conflito;   /* fora da partida: não recebe cartão nem gol */

      msg = `<span class="warn sit">Cumprindo suspensão${t.restavam > 1 ? ` (${t.restavam} jogos)` : ''}</span>`
          + (t.antes > 0 ? ` <b>${t.antes}</b> no ciclo, mantido` : '');

      const dupla = t.jogos > 1;

      msg = `<span class="warn risk">${t.antes} amarelos no ciclo · o próximo suspende</span>`;

      msg = `<span class="warn risk">${t.antes} amarelos no ciclo · o próximo suspende</span>`;

      msg = `<b>${t.depois}</b> ${t.depois === 1 ? 'amarelo' : 'amarelos'} no ciclo`;

/* ── ABA SUSPENSOS ────────────────────────────────────── */
function rSusp() {
  const d = all();
  const pend = d.filter(x => x.s.susp);

  /* agrupa por equipe */
  const byTeam = {};
  pend.forEach(x => { (byTeam[x.p.e] = byTeam[x.p.e] || []).push(x); });

  let h = `<div class="sec"><div class="sec-hd">
      <h2>Suspensos para a ${lastRound + 1}ª rodada</h2>
      <span class="n">${pend.length}</span>
      <div class="acts">
        <button class="btn pri" onclick="copySusp()">Copiar lista</button>
        <button class="btn" onclick="window.print()">Imprimir</button>
      </div></div>`;

  if (!pend.length) {
    h += `<div class="empty"><b>Nenhum suspenso</b>
      <span>Nenhum jogador atingiu o critério até a ${lastRound}ª rodada.</span></div>`;
  } else {
    Object.keys(byTeam).sort().forEach(t => {
      h += `<div class="sus-team"><div class="sus-team-h">${t} · ${byTeam[t].length}</div>`;
      byTeam[t].forEach(({ p, s }) => {
        const ult = s.trig.filter(x => x.r <= lastRound).pop();
        const ms  = ult ? ult.motivos : [];
        const de  = lastRound + 1, ate = lastRound + s.jogosPend;
        h += `<div class="sus-row">
          <div class="sus-card ${cardCls(ms)}"></div>
          <div class="sus-i"><b>${p.n}</b>
            <span>${ult ? motivosTexto(ms) + ' na ' + ult.r + 'ª rodada' : ''}</span></div>
          <div class="sus-r">${s.jogosPend > 1
            ? `<b class="dois">${jogosTexto(s.jogosPend)}</b><br>${rodadasTexto(de, ate)}`
            : `Cumpre na ${de}ª`}</div>
        </div>`;
      });
      h += `</div>`;
    });
  }
  h += `</div>`;

  /* histórico cronológico de todas as suspensões */
  const hist = [];
  d.forEach(({ p, s }) => s.trig.forEach(t => hist.push({ ...t, n: p.n, e: p.e })));
  hist.sort((a, b) => a.r - b.r || a.e.localeCompare(b.e) || a.n.localeCompare(b.n));

  h += `<div class="sec"><div class="sec-hd"><h2>Histórico de suspensões</h2>
    <span class="n">${hist.length}</span></div>`;
  if (!hist.length) {
    h += `<div class="empty"><span>Nenhuma suspensão registrada na liga.</span></div>`;
  } else {
    h += `<table class="hist num"><thead><tr>
      <th style="width:38px">Nº</th><th>Equipe</th><th>Jogador</th>
      <th class="c" style="width:74px">Rodada</th><th>Motivo</th>
      <th class="c" style="width:150px">Cumpre em</th>
      <th class="c" style="width:96px">Ciclo</th><th class="c" style="width:96px">Situação</th>
    </tr></thead><tbody>`;
    hist.forEach((x, k) => {
      const cumprida = x.ate <= lastRound;
      h += `<tr>
        <td class="c mut">${k + 1}</td>
        <td class="mut">${x.e}</td>
        <td style="font-weight:600">${x.n}</td>
        <td class="c">${x.r}ª</td>
        <td>${motivosTexto(x.motivos)}${x.jogos > 1
          ? ` <span class="pill j2">${jogosTexto(x.jogos)}</span>` : ''}</td>
        <td class="c">${rodadasTexto(x.de, x.ate)}</td>
        <td class="c">${x.zera
          ? '<span class="pill zr">Zerou</span>'
          : '<span class="pill mt">Manteve</span>'}</td>
        <td class="c">${cumprida
          ? '<span class="pill ok">Cumprida</span>'
          : '<span class="pill no">Pendente</span>'}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
  }
  h += `</div>`;
  document.getElementById('suspBody').innerHTML = h;
}

function copySusp() {
  const pend = all().filter(x => x.s.susp);
  const byTeam = {};
  pend.forEach(x => { (byTeam[x.p.e] = byTeam[x.p.e] || []).push(x); });

  let txt = `*SUSPENSOS — ${lastRound + 1}ª RODADA*\n1ª Liga RRTV de Futsal\n`;
  if (!pend.length) {
    txt += `\nNenhum jogador suspenso.`;
  } else {
    Object.keys(byTeam).sort().forEach(t => {
      txt += `\n*${t}*\n`;
      byTeam[t].forEach(({ p, s }) => {
        const ult = s.trig.filter(x => x.r <= lastRound).pop();
        const mot = ult ? motivosTexto(ult.motivos) : '';
        txt += `- ${p.n} (${mot})`
             + (s.jogosPend > 1
                ? ` _${jogosTexto(s.jogosPend)}: ${rodadasTexto(lastRound + 1, lastRound + s.jogosPend)}_`
                : '')
             + `\n`;
      });
    });
    txt += `\nTotal: ${pend.length} jogador(es).`;
  }

  const done = () => toast('Lista copiada, pronta para o WhatsApp');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}

function fallbackCopy(txt, cb) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('Não foi possível copiar'); }
  document.body.removeChild(ta);
}

  h += `<th style="width:40px">A</th><th style="width:40px">V</th>
        <th style="width:48px" title="Amarelos acumulados. Zera apenas ao cumprir suspensão por 3 amarelos">Ciclo</th>
        <th style="width:42px">Gols</th><th style="width:96px">Situação</th>`;
  document.getElementById('gHead').innerHTML = h;

  let d = all().filter(({ p, s }) => {
    if (gEq && p.e !== gEq) return false;
    if (gSt === 'S' && !s.susp) return false;
    if (gSt === 'R' && s.ciclo !== YL - 1) return false;
    if (gSt === 'C' && s.ta === 0 && s.tv === 0) return false;
    if (gQ && !p.n.toLowerCase().includes(gQ) && !p.e.toLowerCase().includes(gQ)) return false;
    return true;
  });

  const group = !gEq && !gQ && !gSt;
  let b = '', last = null;
  d.forEach(({ p, i, s }) => {
    if (group && p.e !== last) {
      last = p.e;
      b += `<tr class="gteam"><td colspan="${ROUNDS + 6}">${p.e}</td></tr>`;
    }
    const nm = group ? p.n : `${p.n} <span style="color:var(--ink3);font-weight:400">· ${p.e}</span>`;
    let row = `<td class="pin" title="${p.n} — ${p.e}">${nm}</td>`;
    for (let r = 1; r <= ROUNDS; r++) {
      const c = p.r[r] || '';
      const cls = c === 'AV' ? 'av' : c === '2A' ? 'd2' : c === 'V' ? 'v' : c === 'A' ? 'a' : '';
      const lbl = c === 'AV' ? 'AV' : c === '2A' ? '2' : '';
      const ttl = c === '2A' ? 'dois amarelos, expulso'
                : c === 'AV' ? 'amarelo + vermelho direto'
                : c === 'V'  ? 'vermelho direto' : 'amarelo';
      row += `<td class="${r > lastRound ? 'fut' : ''}">${
        c ? `<span class="gc ${cls}" title="Rodada ${r}: ${ttl}">${lbl}</span>`
          : `<span class="gempty">·</span>`}</td>`;
    }
    const cw = s.ciclo >= 3 ? 'w3' : s.ciclo === 2 ? 'w2' : s.ciclo === 1 ? 'w1' : '';
    const fut = (v, f) => v || f
      ? `${v || '·'}${f ? `<sup class="futn" title="+${f} em rodada não concluída">+${f}</sup>` : ''}`
      : '<span class="gempty">·</span>';
    row += `<td class="gtot a">${fut(s.ta, s.taFut)}</td>
            <td class="gtot v">${fut(s.tv, s.tvFut)}</td>
            <td class="gcic ${cw}">${s.ciclo || '<span class="gempty">·</span>'}</td>
            <td class="gtot">${fut(s.tg, s.tgFut)}</td>
            <td>${s.susp
              ? `<span class="pill no" title="Cumpre ${rodadasTexto(lastRound + 1, lastRound + s.jogosPend)}">Suspenso${s.jogosPend > 1 ? ' ' + s.jogosPend + 'j' : ''}</span>`
              : '<span class="pill ok">Liberado</span>'}</td>`;
    b += `<tr>${row}</tr>`;
  });

  if (!b) b = `<tr><td colspan="${ROUNDS + 6}"><div class="empty">
    <b>Nenhum jogador encontrado</b><span>Ajuste os filtros acima.</span></div></td></tr>`;
  document.getElementById('gBody').innerHTML = b;
}

/* ── ABA ARTILHARIA ───────────────────────────────────── */
function rArti() {
  const d = all().filter(x => x.s.tg > 0).sort((a, b) => b.s.tg - a.s.tg || a.p.n.localeCompare(b.p.n));
  const temGol = all().some(x => x.s.tg > 0 || x.s.tgFut > 0);
  let h = `<div class="sec"><div class="sec-hd"><h2>Artilharia da liga</h2>
    <span class="n">${d.length}</span>${temGol
      ? `<div class="acts"><button class="btn dgr" onclick="zerarGols()">Zerar gols</button></div>` : ''}</div>`;

  if (!d.length) {
    h += `<div class="empty"><b>Nenhum gol lançado</b>
      <span>Use os botões − e + na aba Lançar para registrar os gols de cada rodada.</span></div>`;
  } else {
    const max = d[0].s.tg;
    h += `<table class="rank num"><thead><tr>
      <th class="c" style="width:44px">#</th><th>Jogador</th><th>Equipe</th>
      <th class="c" style="width:56px">Gols</th><th style="width:130px"></th>
      <th class="c" style="width:60px">Média</th>
    </tr></thead><tbody>`;
    let pos = 0, prev = null, real = 0;
    d.forEach(({ p, s }) => {
      real++;
      if (s.tg !== prev) { pos = real; prev = s.tg; }
      h += `<tr class="${pos <= 3 ? 'top' + pos : ''}">
        <td class="c pos">${pos}º</td>
        <td class="nm">${p.n}</td>
        <td class="tm">${p.e}</td>
        <td class="c big">${s.tg}</td>
        <td><div class="bar"><i style="width:${(s.tg / max * 100).toFixed(1)}%"></i></div></td>
        <td class="c" style="color:var(--ink3)">${(s.tg / Math.max(lastRound, 1)).toFixed(2)}</td>
      </tr>`;
    });
    h += `</tbody></table>`;
  }

  /* gols por equipe */
  const tg = TEAMS.map(t => ({
    t, g: all().filter(x => x.p.e === t).reduce((a, x) => a + x.s.tg, 0)
  })).filter(x => x.g > 0).sort((a, b) => b.g - a.g);

  h += `</div>`;
  if (tg.length) {
    const mx = tg[0].g;
    h += `<div class="sec"><div class="sec-hd"><h2>Gols por equipe</h2></div>
      <table class="rank num"><tbody>`;
    tg.forEach((x, k) => {
      h += `<tr><td class="c pos">${k + 1}º</td><td class="nm">${x.t}</td>
        <td class="c big" style="width:56px">${x.g}</td>
        <td style="width:200px"><div class="bar"><i style="width:${(x.g / mx * 100).toFixed(1)}%"></i></div></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  document.getElementById('artiBody').innerHTML = h;
}

/* ── ABA EQUIPES ──────────────────────────────────────── */
function rEqui() {
  const d = all();
  const rows = TEAMS.map(t => {
    const tp = d.filter(x => x.p.e === t);
    const am = tp.reduce((a, x) => a + x.s.ta, 0);
    const vm = tp.reduce((a, x) => a + x.s.tv, 0);
    const sp = tp.reduce((a, x) => a + x.s.trig.reduce((b, t) => b + t.jogos, 0), 0);
    const at = tp.filter(x => x.s.susp).length;
    const gl = tp.reduce((a, x) => a + x.s.tg, 0);
    return { t, n: tp.length, am, vm, sp, at, gl, fp: am + vm * 3 };
  });

  const key = { am: 'am', vm: 'vm', fp: 'fp', sp: 'sp', gl: 'gl', n: 'n' }[eqSort] || 'fp';
  rows.sort((a, b) => b[key] - a[key] || a.t.localeCompare(b.t));

  const th = (k, lbl, ttl) =>
    `<th class="c s${eqSort === k ? '" style="color:var(--ink)' : ''}" onclick="sortEq('${k}')"
      title="${ttl || lbl}">${lbl}${eqSort === k ? ' ▾' : ''}</th>`;

  let h = `<div class="sec"><div class="sec-hd"><h2>Regulamento</h2></div>
    <div class="reg">
      <div class="reg-r">
        <b>3 amarelos acumulados <i class="tag am">A3</i></b>
        <span>Suspensão na partida seguinte. Ao cumpri-la, o ciclo <b class="z">zera</b>.
        Esta é a única situação que zera o ciclo.</span>
      </div>
      <div class="reg-r">
        <b>Vermelho direto <i class="tag vm">V</i></b>
        <span>Suspensão na partida seguinte. Os amarelos que o jogador já tinha
        <b class="m">continuam contando</b> no ciclo depois de cumprida.</span>
      </div>
      <div class="reg-r">
        <b>Amarelo + vermelho direto <i class="tag av">AV</i></b>
        <span>Infrações distintas: o amarelo valeu como advertência e entra no ciclo,
        o vermelho gera a expulsão. Após a suspensão o amarelo
        <b class="m">continua contando</b>.</span>
      </div>
      <div class="reg-r">
        <b>2 amarelos no mesmo jogo <i class="tag am">2A</i></b>
        <span>Os dois se fundem na expulsão e não entram no ciclo. Amarelos anteriores
        <b class="m">continuam contando</b>.</span>
      </div>
      <div class="reg-r sum">
        <b>Motivos somam <i class="tag sm">2 jogos</i></b>
        <span>Quando o jogador fecha o ciclo de 3 amarelos <b>e</b> é expulso na mesma partida,
        as duas punições são independentes: ele cumpre <b class="z">2 jogos</b>, um pelo acúmulo
        e outro pela expulsão.</span>
      </div>
      <label class="reg-opt">
        <input type="checkbox" id="cfgDup"${duploConta ? ' checked' : ''}>
        <span><b>Contar esses 2 amarelos no ciclo de acumulação</b>
        <em>Desmarcado (padrão CBFS): os amarelos foram consumidos pela expulsão e não entram no ciclo.
        Marque apenas se o regulamento da liga determinar o contrário.</em></span>
      </label>
    </div></div>

    <div class="sec"><div class="sec-hd"><h2>Classificação disciplinar</h2>
    <span style="font-size:11px;color:var(--ink3);font-weight:600">Índice = amarelos + vermelhos × 3</span></div>
    <table class="rank num"><thead><tr>
      <th class="c" style="width:44px">#</th><th>Equipe</th>
      ${th('n', 'Jog')}${th('am', 'A')}${th('vm', 'V')}
      ${th('sp', 'Susp', 'Total de suspensões na liga')}
      <th class="c" style="width:64px" title="Suspensos para a próxima rodada">Agora</th>
      ${th('gl', 'Gols')}${th('fp', 'Índice')}
    </tr></thead><tbody>`;
  rows.forEach((x, k) => {
    h += `<tr><td class="c pos">${k + 1}º</td>
      <td class="nm">${x.t}</td>
      <td class="c" style="color:var(--ink3)">${x.n}</td>
      <td class="c" style="font-weight:700;color:var(--am-ink)">${x.am || '·'}</td>
      <td class="c" style="font-weight:700;color:var(--vm)">${x.vm || '·'}</td>
      <td class="c">${x.sp || '·'}</td>
      <td class="c">${x.at ? `<span class="pill no">${x.at}</span>` : '·'}</td>
      <td class="c">${x.gl || '·'}</td>
      <td class="c big">${x.fp}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  /* gestão de elenco */
  h += `<div class="sec"><div class="sec-hd"><h2>Elencos</h2>
    <span class="n">${roster.length}</span></div>
    <div class="addbox">
      <select id="addEq">${TEAMS.map(t => `<option>${t}</option>`).join('')}</select>
      <input id="addNm" placeholder="Nome do jogador" maxlength="42">
      <button class="btn pri" onclick="addPlayer()">Adicionar jogador</button>
    </div>`;

  TEAMS.forEach(t => {
    const tp = d.filter(x => x.p.e === t);
    h += `<div class="sus-team"><div class="sus-team-h">${t} · ${tp.length}</div>`;
    if (!tp.length) {
      h += `<div class="sus-row"><span style="color:var(--ink3);font-size:12.5px">Sem jogadores cadastrados</span></div>`;
    }
    tp.forEach(({ p, i, s }) => {
      h += `<div class="sus-row">
        <div class="sus-i"><b>${p.n}</b>
          <span class="num">${s.ta} A · ${s.tv} V · ${s.tg} gols${s.susp ? ' · suspenso' : ''}</span></div>
        <button class="xbtn" onclick="delPlayer(${i})" title="Remover ${p.n}">&times;</button>
      </div>`;
    });
    h += `</div>`;
  });
  h += `</div>`;
  document.getElementById('equiBody').innerHTML = h;
  bindReg();
}

function zerarGols() {
  const tot = roster.reduce((a, p) => a + Object.values(p.g).reduce((b, v) => b + v, 0), 0);
  if (!tot) { toast('Nenhum gol lançado'); return; }
  if (!confirm(`Apagar todos os ${tot} gol(s) lançados?\n\nOs cartões não serão alterados.`)) return;
  roster.forEach(p => { p.g = {}; });
  save(); rAll(); toast(`${tot} gol(s) apagados`);
}

function sortEq(k) { eqSort = k; rEqui(); }

function bindReg() {
  const el = document.getElementById('cfgDup');
  if (!el) return;
  el.addEventListener('change', e => {
    duploConta = e.target.checked;
    save(); rAll();
    toast(duploConta ? 'Os 2 amarelos passam a contar no ciclo'
                     : 'Os 2 amarelos não contam no ciclo');
  });
}

function addPlayer() {
  const eq = document.getElementById('addEq').value;
  const nmEl = document.getElementById('addNm');
  const nm = nmEl.value.trim();
  if (!nm) { toast('Informe o nome do jogador'); nmEl.focus(); return; }
  if (roster.some(p => p.e === eq && p.n.toLowerCase() === nm.toLowerCase())) {
    toast('Esse jogador já está no elenco'); return;
  }
  roster.push({ e: eq, n: nm, r: {}, g: {} });
  roster.sort((a, b) => TEAMS.indexOf(a.e) - TEAMS.indexOf(b.e) || a.n.localeCompare(b.n));
  save(); rAll(); toast(`${nm} adicionado ao ${eq}`);
}

function delPlayer(i) {
  const p = roster[i];
  if (!p) return;
  const s = stats(p);
  const aviso = (s.ta || s.tv || s.tg)
    ? `\n\nEle tem ${s.ta} amarelo(s), ${s.tv} vermelho(s) e ${s.tg} gol(s) registrados.` : '';
  if (!confirm(`Remover ${p.n} do ${p.e}?${aviso}`)) return;
  roster.splice(i, 1);
  save(); rAll(); toast(`${p.n} removido`);
}

/* ── AÇÕES DE LANÇAMENTO ──────────────────────────────── */
function limparRodada(i) {
  const p = roster[i];
  if (!p) return;
  delete p.r[curRound];
  delete p.g[curRound];
  save(); rAll(); toast(`Lançamentos da ${curRound}ª rodada removidos de ${p.n}`);
}

function servindoAgora(p) {
  const t = timeline(p)[curRound];
  return t && t.serving;
}

function tog(i, kind) {
  const p = roster[i];
  if (!p) return;
  const jaTem = (p.r[curRound] || '') !== '';
  if (servindoAgora(p) && !jaTem) { toast(`${p.n} está suspenso nesta rodada`); return; }
  const c = p.r[curRound] || '';
  const cur = parse(c);
  let am = cur.am, vm = cur.vm;

  if (kind === 'A') {
    am = (am + 1) % 3;        /* 0 → 1 → 2 (expulsão) → 0 */
    if (am === 2) vm = 0;     /* o duplo já é a expulsão */
  } else {
    if (cur.dup) return;      /* expulsão automática, não se desmarca aqui */
    vm = vm ? 0 : 1;
  }

  let nv = '';
  if (am === 2) nv = '2A';
  else if (am === 1 && vm) nv = 'AV';
  else if (am === 1) nv = 'A';
  else if (vm) nv = 'V';

  if (nv) p.r[curRound] = nv; else delete p.r[curRound];
  save(); rAll();
}

function gol(i, delta) {
  const p = roster[i];
  if (!p) return;
  const temGol = (p.g[curRound] || 0) > 0;
  if (servindoAgora(p) && !(temGol && delta < 0)) { toast(`${p.n} está suspenso nesta rodada`); return; }
  const cur = p.g[curRound] || 0;
  const nv = Math.max(0, Math.min(99, cur + delta));
  if (nv) p.g[curRound] = nv; else delete p.g[curRound];
  save(); rAll();
}

function addQuick() {
  if (!curTeam) { toast('Escolha uma equipe primeiro'); return; }
  const nm = (prompt(`Novo jogador do ${curTeam}:`) || '').trim();
  if (!nm) return;
  if (roster.some(p => p.e === curTeam && p.n.toLowerCase() === nm.toLowerCase())) {
    toast('Esse jogador já está no elenco'); return;
  }
  roster.push({ e: curTeam, n: nm, r: {}, g: {} });
  roster.sort((a, b) => TEAMS.indexOf(a.e) - TEAMS.indexOf(b.e) || a.n.localeCompare(b.n));
  save(); rAll(); toast(`${nm} adicionado ao ${curTeam}`);
}

function pickTeam(t) { curTeam = t; save(); rChips(); rSquad(); }
function pickTeamIdx(i) { if (TEAMS[i]) pickTeam(TEAMS[i]); }

function setRound(r) {
  curRound = Math.max(1, Math.min(ROUNDS, r));
  rAll();
}

/* ── RENDER GERAL ─────────────────────────────────────── */
function rAll() {
  rKpis(); rBar(); rChips(); rSquad(); rSusp(); rGrade(); rArti(); rEqui();
}

/* ── PERSISTÊNCIA ─────────────────────────────────────── */
let saveTO = null;
function save() {
  clearTimeout(saveTO);
  saveTO = setTimeout(() => {
    try {
      localStorage.setItem(K_ROS, JSON.stringify(roster));
      localStorage.setItem(K_CFG, JSON.stringify({ lastRound, curRound, curTeam, duploConta }));
    } catch (e) { /* modo somente leitura: dados seguem na memória */ }
  }, 250);
}

function load() {
  const fresh = () => ROSTER.map(p => ({ e: p.e, n: p.n, r: { ...p.r }, g: { ...p.g } }));
  try {
    const raw = localStorage.getItem(K_ROS);
    roster = raw ? JSON.parse(raw) : fresh();
    if (!Array.isArray(roster) || !roster.length) roster = fresh();
  } catch (e) { roster = fresh(); }
  roster.forEach(p => { p.r = p.r || {}; p.g = p.g || {}; });

  /* Migração única (07/08/2026): zera os gols lançados até aqui,
     preservando cartões, rodada oficial e jogadores cadastrados.
     Roda uma vez e grava a marca para não repetir. */
  try {
    const MARCA = 'rrtv_mig_gols_20260807';
    if (!localStorage.getItem(MARCA)) {
      roster.forEach(p => { p.g = {}; });
      localStorage.setItem(MARCA, '1');
      localStorage.setItem(K_ROS, JSON.stringify(roster));
    }
  } catch (e) {}
  try {
    const c = JSON.parse(localStorage.getItem(K_CFG) || '{}');
    lastRound = c.lastRound || 4;
    curRound = c.curRound || lastRound;
    curTeam = c.curTeam || null;
    duploConta = !!c.duploConta;
  } catch (e) { lastRound = 4; curRound = 4; duploConta = false; }
  if (!curTeam || !TEAMS.includes(curTeam)) curTeam = TEAMS[0];
}

/* ── BACKUP ───────────────────────────────────────────── */
function download(name, txt, mime) {
  const b = new Blob([txt], { type: mime || 'application/json' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(u);
}

function doExport() {
  const stamp = new Date().toISOString().slice(0, 10).split('-').reverse().join('');
  download(`controle_disciplinar_rrtv_${stamp}.json`,
    JSON.stringify({ versao: 3, liga: '1ª Liga RRTV de Futsal', lastRound, duploConta, roster }, null, 1));
  toast('Backup gerado');
}

function doImport(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o.roster || !Array.isArray(o.roster)) throw 0;
      roster = o.roster.map(p => ({ e: p.e, n: p.n, r: p.r || {}, g: p.g || {} }));
      if (o.lastRound) { lastRound = o.lastRound; curRound = o.lastRound; }
      duploConta = !!o.duploConta;
      save(); rAll(); toast('Backup restaurado');
    } catch (e) { toast('Arquivo inválido'); }
  };
  fr.readAsText(file);
}

function doReset() {
  if (!confirm('Zerar todos os cartões e gols, voltando aos dados originais da planilha?\n\nGere um backup antes se quiser guardar o que já foi lançado.')) return;
  try { localStorage.removeItem(K_ROS); localStorage.removeItem(K_CFG); } catch (e) {}
  load(); rAll(); toast('Dados restaurados ao original');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ── EVENTOS ──────────────────────────────────────────── */
document.querySelectorAll('.nav-b').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.nav-b').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('p-' + b.dataset.p).classList.add('on');
    document.getElementById('rbar').style.display = (b.dataset.p === 'lanc') ? '' : 'none';
  });
});

document.getElementById('rPrev').addEventListener('click', () => setRound(curRound - 1));
document.getElementById('rNext').addEventListener('click', () => setRound(curRound + 1));
document.getElementById('rDone').addEventListener('change', e => {
  lastRound = e.target.checked ? Math.max(lastRound, curRound) : curRound - 1;
  lastRound = Math.max(0, Math.min(ROUNDS, lastRound));
  save(); rAll();
});

document.getElementById('gEq').addEventListener('change', e => { gEq = e.target.value; rGrade(); });
document.getElementById('gSt').addEventListener('change', e => { gSt = e.target.value; rGrade(); });
document.getElementById('gQ').addEventListener('input', e => { gQ = e.target.value.trim().toLowerCase(); rGrade(); });

document.getElementById('bExp').addEventListener('click', doExport);
document.getElementById('bImp').addEventListener('click', () => document.getElementById('fileIn').click());
document.getElementById('bReset').addEventListener('click', doReset);
document.getElementById('fileIn').addEventListener('change', e => {
  if (e.target.files[0]) doImport(e.target.files[0]);
  e.target.value = '';
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') setRound(curRound - 1);
  if (e.key === 'ArrowRight') setRound(curRound + 1);
});

/* ── INÍCIO ───────────────────────────────────────────── */
load();
document.getElementById('gEq').innerHTML =
  '<option value="">Todas as equipes</option>' + TEAMS.map(t => `<option>${t}</option>`).join('');
rAll();

</script>
</body>
</html>
