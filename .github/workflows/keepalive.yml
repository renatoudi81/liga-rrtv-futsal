name: Manter Supabase ativo
 
on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 9h UTC (6h em Brasília)
  workflow_dispatch:        # permite rodar manualmente na aba Actions
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco da liga
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kktvmwttlordoltntlnl.supabase.co/rest/v1/estado?id=eq.liga&select=id&apikey=sb_publishable_feyAIoTFiFJ-bXglIHH6yw_Ty4quQaF")
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "Supabase respondeu $codigo em vez de 200"
            exit 1
          fi
 
